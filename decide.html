<script>

window.DecisionCore = {
  create: function(opts){
    var DATA = opts.data, VALID = DATA.valid_tags || [];
    var decisions = {}, persistFn = opts.persist || function(){}, onStat = opts.onStat || function(){};
    var bodyEl = typeof opts.body === 'string' ? document.getElementById(opts.body) : opts.body;
    function esc(x){ return String(x==null?'':x).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]}); }
    function defaults(){ var d={}; DATA.items.forEach(function(it){ d[it.push_no]={decision:null,tags:it.tags,rec:it.rec}; }); return d; }
    function splitTags(s){ return String(s||'').split(/[,，、;；\s]+/).map(function(t){return t.trim()}).filter(Boolean); }
    function tagError(s){
      var ts = splitTags(s);
      if (ts.length > 3) return '最多 3 个标签';
      for (var i=0;i<ts.length;i++){ if (VALID.length && VALID.indexOf(ts[i])<0) return '「'+ts[i]+'」不在标签库'; }
      return '';
    }
    function get(){ return decisions; }
    function updateStat(){ var n=Object.keys(decisions).filter(function(k){return decisions[k].decision}).length; onStat(n, DATA.items.length); }
    function render(){
      if (!DATA.items.length){ bodyEl.innerHTML=''; updateStat(); return; }
      var dl = '<datalist id="taglib">'+VALID.map(function(t){return '<option value="'+esc(t)+'">'}).join('')+'</datalist>';
      var h = dl;
      DATA.items.forEach(function(it){
        var d = decisions[it.push_no] || (decisions[it.push_no]={decision:null,tags:it.tags,rec:it.rec});
        var te = tagError(d.tags);
        h += '<tr data-no="'+it.push_no+'">'
          + '<td class="num">'+esc(it.push_no)+'</td>'
          + '<td><div class="co">'+esc(it.company)+'</div><div class="pj">'+esc(it.project)+'</div></td>'
          + '<td class="num">'+esc(it.budget)+'</td>'
          + '<td class="num">'+esc(it.deadline)+'</td>'
          + '<td><input list="taglib" placeholder="最多3个，逗号分隔" class="tag-in'+(te?' bad':'')+'" data-no="'+it.push_no+'" value="'+esc(d.tags)+'"/>'
          + (te?'<div class="tag-err">'+esc(te)+'</div>':'')+'</td>'
          + '<td><select class="rec-sel" data-no="'+it.push_no+'">'
          + ["强烈建议投标", "建议投标", "可关注"].map(function(r){return '<option'+(r===d.rec?' selected':'')+'>'+r+'</option>'}).join('')
          + '</select></td>'
          + '<td><div class="rec-seg">'
          + '<button type="button" class="chip pos" data-no="'+it.push_no+'" data-v="纳入" aria-pressed="'+(d.decision==='纳入')+'">纳入</button>'
          + '<button type="button" class="chip neg" data-no="'+it.push_no+'" data-v="不纳入" aria-pressed="'+(d.decision==='不纳入')+'">不纳入</button>'
          + '</div></td></tr>';
      });
      bodyEl.innerHTML = h;
      bodyEl.querySelectorAll('.chip').forEach(function(c){
        c.addEventListener('click', function(){
          var no = +c.dataset.no;
          decisions[no].decision = (decisions[no].decision===c.dataset.v) ? null : c.dataset.v;
          persistFn(decisions); updateStat();
          c.closest('tr').querySelectorAll('.chip').forEach(function(x){
            x.setAttribute('aria-pressed', decisions[no].decision===x.dataset.v ? 'true':'false');
          });
        });
      });
      bodyEl.querySelectorAll('.tag-in').forEach(function(t){
        t.addEventListener('input', function(){ decisions[+t.dataset.no].tags=t.value; persistFn(decisions); });
        t.addEventListener('change', function(){ decisions[+t.dataset.no].tags=t.value.trim(); persistFn(decisions); render(); });
        t.addEventListener('blur', function(){ render(); });
      });
      bodyEl.querySelectorAll('.rec-sel').forEach(function(sel){
        sel.addEventListener('change', function(){ decisions[+sel.dataset.no].rec=sel.value; persistFn(decisions); updateStat(); });
      });
      updateStat();
    }
    // 收集提交载荷；errors 非空时禁止提交
    function collect(){
      var ds=[], errs=[];
      DATA.items.forEach(function(it){
        var d = decisions[it.push_no]; if (!d || !d.decision) return;
        var te = tagError(d.tags);
        if (te){ errs.push('第'+it.push_no+'行：'+te); return; }
        ds.push({push_no:it.push_no, decision:d.decision, tags:splitTags(d.tags).join(','), rec:d.rec});
      });
      return {list:ds, errors:errs};
    }
    return {
      render: render, collect: collect, get: get,
      snapshot: function(){ return JSON.parse(JSON.stringify(decisions)); },
      restore: function(saved){ decisions = (saved && typeof saved==='object') ? saved : defaults(); render(); persistFn(decisions); },
      reset: function(){ decisions = defaults(); render(); persistFn(decisions); }
    };
  }
};

  function ab(h){var a=new Uint8Array(h.length/2);for(var i=0;i<a.length;i++)a[i]=parseInt(h.substr(i*2,2),16);return a;}

  function pbkdf2(pwd,salt,iter){
    var enc=new TextEncoder();
    return crypto.subtle.importKey('raw',enc.encode(pwd),'PBKDF2',false,['deriveKey']).then(function(k){
      return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:iter,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);
    });
  }
  function gateShow(html){var g=document.getElementById('gate');g.innerHTML=html;g.classList.remove('hide');g.style.display='flex';}
  function gateHide(){var g=document.getElementById('gate');g.classList.add('hide');setTimeout(function(){g.style.display='none'},250);}
  function decryptData(dekBuf){
    return crypto.subtle.importKey('raw',dekBuf,'AES-GCM',false,['decrypt']).then(function(k){
      return crypto.subtle.decrypt({name:'AES-GCM',iv:ab(BLOB.iv)},k,ab(BLOB.ct));

function start(DATA){
  var appEl=document.getElementById('app'); if(appEl) appEl.style.display='block';
  var $=function(id){return document.getElementById(id)};
  $('batch').textContent=DATA.batch+' 批次 · '+DATA.items.length+' 条候选';
  (function(){ /* 与晨报同口径 KPI 状态条 */
    var L=DATA.loop; if(!L){document.getElementById('kpiStrip').style.display='none';return}
    var set=function(id,v){document.getElementById(id).textContent=(v==null?'–':v)};
    set('kpiProposed',L.proposed);set('kpiAdopted',L.adopted);set('kpiPending',L.pending);set('kpiBoard',L.board_total);
    var bm=document.getElementById('boardMeta');
    if(L.board_version){bm.textContent='看板 '+L.board_version+(L.board_total!=null?' · '+L.board_total+' 个项目':'')+(L.board_date?' · '+L.board_date+' 更新':'')}
    else{bm.style.display='none'}
  })();
  var KEY='decide-'+DATA.batch;
  var core=window.DecisionCore.create({
    data:DATA, body:'body',
    persist:function(d){ try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){} },
    onStat:function(n,t){ $('stat').textContent='已决 '+n+' / '+t+' 条（本机自动保存）' }
  });
  (function(){ try{ var v=localStorage.getItem(KEY); if(v){ core.restore(JSON.parse(v)); return } }catch(e){} core.reset(); })();
  if(!DATA.items.length){
    document.querySelector('.tbl-wrap').style.display='none';
    $('empty').style.display='block';
    $('gen').disabled=true;
    $('stat').textContent='本批次无需决策';
  }
  $('gen').addEventListener('click',function(){
    var r=core.collect();
    if(r.errors.length){ $('msg').className='msg err'; $('msg').innerHTML=r.errors.join('<br/>'); return }
    if(!r.list.length){ $('msg').className='msg err'; $('msg').textContent='请先点选至少一条'; return }
    var byNo={}; DATA.items.forEach(function(it){ byNo[it.push_no]=it });
    var parts=r.list.map(function(d){
      var it=byNo[d.push_no];
      var s=d.push_no+(d.decision==='纳入'?'纳入':'不纳入');
      var ts=String(d.tags||'').split(',').filter(Boolean);
      var orig=String(it.tags||'').split(/[,，、;；\s]+/).map(function(t){return t.trim()}).filter(Boolean);
      if(ts.join()!==orig.join())s+='（标签：'+ts.join('、')+'）';
      if(d.rec!==it.rec)s+='（建议：'+d.rec+'）';
      return s;
    });
    var txt='【候选决策 '+DATA.batch+'】'+parts.join('；');
    $('out').style.display='block';$('out').value=txt;$('copybtn').style.display='block';
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){
        $('msg').className='msg ok';$('msg').textContent='已复制 '+parts.length+' 条决策指令，请到 Kimi「银信标讯」项目对话粘贴发送';
      },function(){$('msg').className='msg ok';$('msg').textContent='复制失败，请长按上方文本框手动复制'});
    }else{$('msg').className='msg ok';$('msg').textContent='请长按上方文本框手动复制后发送到 Kimi 对话'}
  });
  $('copybtn').addEventListener('click',function(){
    var txt=$('out').value;
    if(!txt){$('msg').className='msg err';$('msg').textContent='请先生成决策指令';return}
    function okMsg(m){$('msg').className='msg ok';$('msg').textContent=m}
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){okMsg('已复制，请到 Kimi「银信标讯」项目对话粘贴发送')},function(){
        $('out').select();document.execCommand&&document.execCommand('copy');okMsg('已复制（兼容模式），请到 Kimi 对话粘贴发送');
      });
    }else{$('out').select();document.execCommand&&document.execCommand('copy');okMsg('已复制（兼容模式），请到 Kimi 对话粘贴发送')}
  });
}
